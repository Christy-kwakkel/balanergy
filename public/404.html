<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Balanergy</title>
  <script>
    var path = window.location.pathname;
    if (path !== '/' && path.endsWith('/')) {
      path = path.slice(0, -1);
    }
    sessionStorage.redirect = path;
    window.location.href = '/';
  </script>
</head>
</html>
